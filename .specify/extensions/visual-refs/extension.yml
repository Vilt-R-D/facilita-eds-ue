schema_version: "1.0"

extension:
  id: visual-refs
  name: "Visual Reference Hooks"
  version: "1.0.0"
  description: >-
    Prepends a visual-context task to tasks.md by parsing PNG/SVG references
    out of the **Input** line of spec.md, so /speckit-implement loads those
    images into context before any feature task runs.
  author: facilita-eds
  license: MIT

requires:
  speckit_version: ">=0.8.5"
  tools: []

provides:
  commands:
    - name: speckit.visual-refs.prepend-task
      file: commands/speckit.visual-refs.prepend-task.md
      description: "Prepend a visual-context task to tasks.md based on spec.md **Input** line"

hooks:
  after_tasks:
    command: speckit.visual-refs.prepend-task
    optional: false
    prompt: null
    condition: null
    description: "Prepend a visual-context task to tasks.md based on spec.md **Input** line"

tags:
  - "visual"
  - "specify"
  - "tasks"
  - "implement"
